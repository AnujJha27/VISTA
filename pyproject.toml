[project]
name = "vista"
version = "0.1.0"
description = "Artifact-grounded structural verification of exported ML models with Lean"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Anuj" }
]
keywords = ["lean", "formal-methods", "formal-verification", "machine-learning", "research-prototype"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
# `vista` is the canonical, documented command (README.md). The
# `noether*` aliases below are kept only for compatibility with existing
# scripts/muscle memory from this project's earlier name -- never
# advertised in README, never the documented entrypoint.
vista = "dftcert.local_cli:main"
noether = "dftcert.local_cli:main"
noether-structural = "dftcert.structural.cli:main"
noether-dftcert = "dftcert.legacy.cli:main"
noether-orchestrator = "orchestrator.cli:main"
noether-replay = "orchestrator.replay:main"
noether-tui = "dftcert.tui:main"

[tool.setuptools]
packages = ["dftcert", "dftcert.legacy", "dftcert.structural", "orchestrator", "extractors"]
py-modules = []

[tool.ruff]
line-length = 88
target-version = "py311"
