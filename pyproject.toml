[project]
name = "vista"
version = "0.1.0"
description = "Artifact-grounded structural verification of exported ML models with Lean"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Anuj" }
]
keywords = ["lean", "formal-methods", "formal-verification", "machine-learning", "research-prototype"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
vista = "dftcert.local_cli:main"

[tool.setuptools]
packages = ["dftcert", "dftcert.legacy", "dftcert.structural", "orchestrator", "extractors"]
py-modules = []

[tool.ruff]
line-length = 88
target-version = "py311"
