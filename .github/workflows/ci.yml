name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev nlohmann-json3-dev curl

      - name: Install elan and Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and test
        run: make test

      - name: Smoke benchmark
        run: make benchmark

      - name: Theorem-centric verification tests
        # research-readiness audit section 10: `make test` above never
        # exercised the theorem-centric suite (session/certificate
        # generation, generic Lean introspection, real-artifact E2E) at
        # all. `lake exe cache get` fetches prebuilt mathlib oleans rather
        # than building from source. Bubblewrap-sandbox-specific tests
        # skip themselves explicitly (visible in the test output) when
        # `bwrap` or a torch-capable sandboxed interpreter isn't
        # available on this runner -- never faked.
        timeout-minutes: 45
        run: make verification-test
